name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Upload static game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published game
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          curl --fail --location --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$base/" -o /tmp/pig-game-index.html
          grep -q '<title>猪了个猪</title>' /tmp/pig-game-index.html
          for asset in styles.css main.mjs engine.mjs audio.mjs assets/pig-mascot.png assets/icons-atlas.png assets/farm-bg.png; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --output /dev/null "$base/$asset"
          done
